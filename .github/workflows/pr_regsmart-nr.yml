name: PR regsmart no RTP

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "aeon/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@eade339d65eec2d0735d023c760ab01697afbc68"

jobs:
  pytest-regsmart-nr:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clear disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          dotnet: false
          large-packages: false
          swap-storage: false

      - name: Set swap space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'no numba cache') }}
        name: Restore numba cache
        uses: ./.github/actions/numba_cache
        with:
          cache_name: "pytest"
          runner_os: ${{ runner.os }}
          python_version: ${{ matrix.python-version }}

      - name: Install aeon and dependencies
        uses: ./.github/actions/cpu_all_extras
        with:
          python_version: ${{ matrix.python-version }}
          additional_extras: "dev"
      
      - name: Install pytest-regsmart
        run: |
          python -m pip install "$REGSMART_PACKAGE"
          python -m pip freeze

      - name: Show dependencies
        run: python -m pip list

      - name: Run tests w/ pytest-regsmart nr
        run: python -m pytest --regsmart --no-rank -n logical --prtesting ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full pytest actions') }}

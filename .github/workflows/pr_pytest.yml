name: PR pytest

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
        python-version: [ "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clear disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          dotnet: false
          large-packages: false
          swap-storage: false

      - name: Set swap space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'no numba cache') }}
        name: Restore numba cache
        uses: ./.github/actions/numba_cache
        with:
          cache_name: "pytest"
          runner_os: ${{ runner.os }}
          python_version: ${{ matrix.python-version }}

      - name: Install aeon and dependencies
        uses: ./.github/actions/cpu_all_extras
        with:
          python_version: ${{ matrix.python-version }}
          additional_extras: "dev"

      - name: Install reportlog
        run: |
          python -m pip install pytest-reportlog
          python -m pip freeze

      - name: Show dependencies
        run: python -m pip list

      - name: Run tests
        # run the full test suite if a PR has the 'full pytest actions' label
        run: python -m pytest --report-log=reportlog.jsonl -n logical --prtesting ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full pytest actions') }}

      - name: Upload report-log
        if: ${{ !cancelled() }}   # com mutante o step de teste falha; sem isso o arquivo não sobe
        uses: actions/upload-artifact@v4
        with:
          name: reportlog-baseline
          path: reportlog.jsonl
          retention-days: 14
          if-no-files-found: warn
